<!-- =====================================================
     COACH LOGIN
===================================================== -->

<div
  id="coachLoginModal"
  class="coach-login-modal"
>

  <div class="coach-login-overlay">

    <div class="coach-login-box">

      <button
        type="button"
        id="closeCoachLogin"
        class="coach-login-close"
      >
        ×
      </button>

      <div class="coach-login-icon">
        🥋
      </div>

      <div class="coach-login-brand">
        جودو طبیعت
      </div>

      <h2>
        ورود مربی
      </h2>

      <p>
        ورود به پنل مدیریت باشگاه
      </p>

      <form
        id="coachLoginForm"
        autocomplete="on"
      >

        <div class="coach-login-field">

          <label
            for="coachEmail"
          >
            ایمیل مربی
          </label>

          <input
            id="coachEmail"
            type="email"
            autocomplete="username"
            placeholder="ایمیل مربی"
            required
          >

        </div>

        <div class="coach-login-field">

          <label
            for="coachPassword"
          >
            رمز عبور
          </label>

          <div class="password-wrap">

            <input
              id="coachPassword"
              type="password"
              autocomplete="current-password"
              placeholder="رمز عبور"
              required
            >

            <button
              type="button"
              id="toggleCoachPassword"
              class="password-toggle"
            >
              👁️
            </button>

          </div>

        </div>

        <div
          id="coachLoginError"
          class="coach-login-error"
          style="display:none"
        ></div>

        <button
          type="submit"
          id="coachLoginSubmit"
          class="coach-login-submit"
        >
          🔐 ورود به سامانه
        </button>

      </form>

      <div class="coach-login-footer">
        طبیعت جودو
        <span>•</span>
        سامانه عملکرد ورزشکاران
      </div>

    </div>

  </div>

</div>
