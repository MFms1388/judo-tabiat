  <title>پروفایل ورزشکار | جودو طبیعت</title>  <link rel="stylesheet" href="style.css">  <style>

    /* =========================================
       ATHLETE PAGE
    ========================================== */

    body {
      background: #f5f7f6;
    }

    .athlete-profile-page {
      min-height: 100vh;
      padding: 25px;
      box-sizing: border-box;
    }

    .athlete-profile-container {
      width: min(1100px, 100%);
      margin: 0 auto;
    }


    /* =========================================
       TOP BAR
    ========================================== */

    .athlete-profile-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .athlete-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .athlete-logo {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      background: #16834b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      box-shadow: 0 8px 20px rgba(22,131,75,.2);
    }

    .athlete-brand strong {
      display: block;
      font-size: 19px;
    }

    .athlete-brand span {
      display: block;
      color: #777;
      font-size: 13px;
      margin-top: 3px;
    }

    .back-btn {
      border: none;
      background: white;
      color: #16834b;
      border-radius: 12px;
      padding: 11px 17px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }

    .back-btn:hover {
      background: #edf7f1;
    }


    /* =========================================
       PROFILE HERO
    ========================================== */

    .athlete-profile-hero {
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(0,0,0,.06);
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 25px;
      align-items: center;
      margin-bottom: 22px;
    }

    .athlete-photo {
      width: 150px;
      height: 150px;
      border-radius: 25px;
      overflow: hidden;
      background: #edf7f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 65px;
    }

    .athlete-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .athlete-hero-info h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .athlete-hero-info p {
      margin: 5px 0;
      color: #777;
    }

    .athlete-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
      padding: 7px 12px;
      border-radius: 20px;
      background: #edf7f1;
      color: #16834b;
      font-size: 13px;
      font-weight: 700;
    }

    .athlete-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16834b;
    }


    /* =========================================
       INFO GRID
    ========================================== */

    .athlete-info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 22px;
    }

    .athlete-info-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 7px 25px rgba(0,0,0,.05);
    }

    .athlete-info-card span {
      display: block;
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .athlete-info-card strong {
      display: block;
      font-size: 20px;
      color: #222;
    }


    /* =========================================
       SECTIONS
    ========================================== */

    .athlete-section {
      background: white;
      border-radius: 20px;
      padding: 23px;
      margin-bottom: 20px;
      box-shadow: 0 7px 25px rgba(0,0,0,.05);
    }

    .athlete-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .athlete-section-title h2 {
      margin: 0;
      font-size: 20px;
    }

    .athlete-section-title span {
      color: #16834b;
      font-size: 13px;
      font-weight: 700;
    }


    /* =========================================
       SCORE
    ========================================== */

    .total-score-box {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 25px;
      align-items: center;
    }

    .total-score-number {
      min-height: 150px;
      border-radius: 22px;
      background: #edf7f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .total-score-number strong {
      font-size: 45px;
      color: #16834b;
      line-height: 1;
    }

    .total-score-number span {
      margin-top: 10px;
      color: #777;
      font-size: 13px;
    }

    .score-description {
      color: #666;
      line-height: 2;
    }


    /* =========================================
       BIO
    ========================================== */

    .athlete-bio {
      color: #555;
      line-height: 2;
      margin: 0;
      white-space: pre-wrap;
    }


    /* =========================================
       LOADING
    ========================================== */

    .athlete-loading {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-card {
      width: min(450px, 100%);
      background: white;
      border-radius: 22px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.06);
    }

    .loading-icon {
      font-size: 50px;
      margin-bottom: 12px;
    }

    .loading-card h2 {
      margin: 0 0 8px;
    }

    .loading-card p {
      color: #777;
      margin: 0;
    }


    /* =========================================
       ERROR
    ========================================== */

    .athlete-error {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .error-card {
      width: min(500px, 100%);
      background: white;
      border-radius: 22px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.06);
    }

    .error-icon {
      font-size: 55px;
      margin-bottom: 12px;
    }

    .error-card h2 {
      margin: 0 0 8px;
    }

    .error-card p {
      color: #777;
      line-height: 1.9;
      margin-bottom: 20px;
    }


    /* =========================================
       MOBILE
    ========================================== */

    @media (max-width: 800px) {

      .athlete-info-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .athlete-profile-hero {
        grid-template-columns: 110px 1fr;
      }

      .athlete-photo {
        width: 110px;
        height: 110px;
      }

      .athlete-hero-info h1 {
        font-size: 25px;
      }

    }


    @media (max-width: 550px) {

      .athlete-profile-page {
        padding: 15px;
      }

      .athlete-profile-topbar {
        align-items: flex-start;
      }

      .athlete-profile-hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .athlete-photo {
        margin: 0 auto;
      }

      .athlete-status {
        justify-content: center;
      }

      .athlete-info-grid {
        grid-template-columns: 1fr 1fr;
      }

      .total-score-box {
        grid-template-columns: 1fr;
      }

      .total-score-number {
        min-height: 130px;
      }

      .athlete-brand strong {
        font-size: 16px;
      }

      .athlete-brand span {
        font-size: 11px;
      }

      .back-btn {
        padding: 9px 12px;
        font-size: 12px;
      }

    }

  </style></head><body>  <div class="athlete-profile-page"><div class="athlete-profile-container">


  <!-- =====================================
       TOPBAR
  ====================================== -->

  <div class="athlete-profile-topbar">

    <div class="athlete-brand">

      <div class="athlete-logo">
        🥋
      </div>

      <div>

        <strong>
          جودو طبیعت
        </strong>

        <span>
          پروفایل ورزشکار
        </span>

      </div>

    </div>


    <button
      class="back-btn"
      type="button"
      id="backBtn"
    >
      ← بازگشت
    </button>

  </div>


  <!-- =====================================
       CONTENT
  ====================================== -->

  <div id="athleteContent">

    <div class="athlete-loading">

      <div class="loading-card">

        <div class="loading-icon">
          🥋
        </div>

        <h2>
          در حال بارگذاری...
        </h2>

        <p>
          اطلاعات ورزشکار در حال دریافت است.
        </p>

      </div>

    </div>

  </div>


</div>

  </div>  <!-- =====================================
       SUPABASE
  ====================================== -->  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <!-- =====================================
       ATHLETE JS
  ====================================== -->  <script>

    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL =
      "https://bkkdgywdptufjsaepehc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KBAMUqB0oL8fA0iNIKcv-w_brwIBHpd";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =====================================================
    // HELPERS
    // =====================================================

    function escapeHTML(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value === undefined ||
        value === null
          ? ""
          : String(value);

      return div.innerHTML;

    }


    function persianNumber(value) {

      return String(value).replace(
        /\d/g,
        d => "۰۱۲۳۴۵۶۷۸۹"[d]
      );

    }


    function getAthleteName(athlete) {

      if (!athlete) {
        return "بدون نام";
      }

      return [

        athlete.first_name,
        athlete.last_name

      ]
        .filter(Boolean)
        .join(" ")
        .trim() || "بدون نام";

    }


    function formatWeight(weight) {

      if (
        weight === null ||
        weight === undefined ||
        weight === ""
      ) {

        return "—";

      }

      const number =
        Number(weight);

      if (Number.isNaN(number)) {
        return String(weight);
      }

      return number
        .toFixed(1)
        .replace(".0", "");

    }


    // =====================================================
    // GET ATHLETE ID
    // =====================================================

    function getAthleteId() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      return params.get("id");

    }


    // =====================================================
    // LOAD ATHLETE
    // =====================================================

    async function loadAthlete() {

      const athleteId =
        getAthleteId();


      if (!athleteId) {

        showError(
          "شناسه ورزشکار در آدرس صفحه وجود ندارد."
        );

        return;

      }


      try {

        const result =
          await supabaseClient
            .from("athletes")
            .select("*")
            .eq("id", athleteId)
            .single();


        if (result.error) {

          console.error(
            "Athlete load error:",
            result.error
          );

          showError(
            "اطلاعات ورزشکار پیدا نشد."
          );

          return;

        }


        if (!result.data) {

          showError(
            "ورزشکار موردنظر وجود ندارد."
          );

          return;

        }


        renderAthlete(
          result.data
        );

      } catch (error) {

        console.error(
          "Load athlete error:",
          error
        );

        showError(
          "خطایی هنگام دریافت اطلاعات ورزشکار رخ داد."
        );

      }

    }


    // =====================================================
    // RENDER ATHLETE
    // =====================================================

    function renderAthlete(athlete) {

      const container =
        document.getElementById(
          "athleteContent"
        );


      if (!container) {
        return;
      }


      const name =
        getAthleteName(
          athlete
        );


      const ageGroup =
        athlete.age_group ||
        "—";


      const weight =
        formatWeight(
          athlete.weight
        );


      const nationalId =
        athlete.national_id ||
        "—";


      const totalScore =
        Number(
          athlete.total_score || 0
        );


      const photo =
        athlete.photo_url ||
        "";


      container.innerHTML = `

        <!-- =====================================
             PROFILE HERO
        ====================================== -->

        <section
          class="athlete-profile-hero"
        >

          <div
            class="athlete-photo"
          >

            ${
              photo
                ? `
                  <img
                    src="${escapeHTML(photo)}"
                    alt="${escapeHTML(name)}"
                  >
                `
                : `
                  🥋
                `
            }

          </div>


          <div
            class="athlete-hero-info"
          >

            <h1>
              ${escapeHTML(name)}
            </h1>

            <p>
              ورزشکار جودو طبیعت
            </p>

            <div
              class="athlete-status"
            >

              <span
                class="athlete-status-dot"
              ></span>

              فعال

            </div>

          </div>

        </section>


        <!-- =====================================
             INFO
        ====================================== -->

        <section
          class="athlete-info-grid"
        >

          <div
            class="athlete-info-card"
          >

            <span>
              رده سنی
            </span>

            <strong>
              ${escapeHTML(ageGroup)}
            </strong>

          </div>


          <div
            class="athlete-info-card"
          >

            <span>
              وزن
            </span>

            <strong>
              ${persianNumber(weight)}
              ${
                weight !== "—"
                  ? " کیلو"
                  : ""
              }
            </strong>

          </div>


          <div
            class="athlete-info-card"
          >

            <span>
              کد ملی
            </span>

            <strong>
              ${escapeHTML(nationalId)}
            </strong>

          </div>


          <div
            class="athlete-info-card"
          >

            <span>
              شناسه ورزشکار
            </span>

            <strong
              style="
                font-size:12px;
                word-break:break-all;
              "
            >
              ${escapeHTML(athlete.id)}
            </strong>

          </div>

        </section>


        <!-- =====================================
             SCORE
        ====================================== -->

        <section
          class="athlete-section"
        >

          <div
            class="athlete-section-title"
          >

            <h2>
              📊 عملکرد کلی
            </h2>

            <span>
              امتیاز فعلی
            </span>

          </div>


          <div
            class="total-score-box"
          >

            <div
              class="total-score-number"
            >

              <strong>
                ${persianNumber(
                  totalScore.toFixed(2)
                )}
              </strong>

              <span>
                از ۱۰
              </span>

            </div>


            <div
              class="score-description"
            >

              ${
                totalScore > 0
                  ? `
                    امتیاز فعلی ورزشکار بر اساس
                    اطلاعات ثبت‌شده در سامانه نمایش داده می‌شود.
                  `
                  : `
                    هنوز امتیاز ارزیابی برای این ورزشکار
                    ثبت نشده است.
                  `
              }

            </div>

          </div>

        </section>


        <!-- =====================================
             BIO
        ====================================== -->

        <section
          class="athlete-section"
        >

          <div
            class="athlete-section-title"
          >

            <h2>
              📝 درباره ورزشکار
            </h2>

          </div>


          ${
            athlete.bio
              ? `
                <p class="athlete-bio">
                  ${escapeHTML(
                    athlete.bio
                  )}
                </p>
              `
              : `
                <p
                  class="athlete-bio"
                  style="color:#999;"
                >
                  توضیحاتی برای این ورزشکار ثبت نشده است.
                </p>
              `
          }

        </section>


        <!-- =====================================
             NEXT STAGE
        ====================================== -->

        <section
          class="athlete-section"
        >

          <div
            class="athlete-section-title"
          >

            <h2>
              🚀 اطلاعات بیشتر
            </h2>

          </div>


          <p
            style="
              margin:0;
              color:#777;
              line-height:2;
            "
          >
            تاریخچه ارزیابی‌ها، جزئیات معیارها،
            روند پیشرفت، حضور و غیاب و مقام‌های
            ورزشکار در مراحل بعدی به این صفحه اضافه خواهد شد.
          </p>

        </section>

      `;

    }


    // =====================================================
    // ERROR
    // =====================================================

    function showError(message) {

      const container =
        document.getElementById(
          "athleteContent"
        );


      if (!container) {
        return;
      }


      container.innerHTML = `

        <div class="athlete-error">

          <div class="error-card">

            <div class="error-icon">
              ⚠️
            </div>

            <h2>
              ورزشکار پیدا نشد
            </h2>

            <p>
              ${escapeHTML(message)}
            </p>

            <button
              class="back-btn"
              type="button"
              onclick="history.back()"
            >
              ← بازگشت
            </button>

          </div>

        </div>

      `;

    }


    // =====================================================
    // BACK BUTTON
    // =====================================================

    document
      .getElementById("backBtn")
      ?.addEventListener(
        "click",
        function () {

          if (
            document.referrer &&
            document.referrer.includes(
              window.location.host
            )
          ) {

            history.back();

          } else {

            window.location.href =
              "coach.html";

          }

        }
      );


    // =====================================================
    // START
    // =====================================================

    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        loadAthlete
      );

    } else {

      loadAthlete();

    }

  </script></body></html>
