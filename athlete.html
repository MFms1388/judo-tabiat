<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>پروفایل ورزشکار | جودو طبیعت</title>

  <meta
    name="description"
    content="پروفایل اختصاصی ورزشکاران جودو طبیعت"
  >

  <link rel="stylesheet" href="style.css">

  <style>

    :root {
      --nature: #198754;
      --nature-dark: #126b42;
      --bg: #f4f6f5;
      --card: #ffffff;
      --text: #171a19;
      --muted: #68716d;
      --border: #e4e8e6;
      --shadow: 0 10px 30px rgba(0, 0, 0, .06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Tahoma,
        Arial,
        sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    .athlete-header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--nature);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .brand-text strong {
      display: block;
      font-size: 17px;
      color: var(--text);
    }

    .brand-text span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .back-btn {
      border: 0;
      background: var(--nature);
      color: #fff;
      padding: 11px 17px;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: .2s;
    }

    .back-btn:hover {
      background: var(--nature-dark);
      transform: translateY(-1px);
    }

    /* =========================
       MAIN
    ========================= */

    .athlete-page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    .page-title {
      margin-bottom: 20px;
    }

    .page-title small {
      color: var(--nature);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: .5px;
    }

    .page-title h1 {
      margin: 7px 0 5px;
      font-size: 28px;
      color: var(--text);
    }

    .page-title p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 20px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 25px;

      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .athlete-avatar {
      width: 90px;
      height: 90px;
      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #e8f5ee;
      color: var(--nature);
      font-size: 38px;
    }

    .profile-info h2 {
      margin: 0 0 9px;
      font-size: 25px;
      color: var(--text);
    }

    .profile-info p {
      margin: 5px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--nature) !important;
      font-weight: bold;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--nature);
    }

    .overall-score {
      min-width: 145px;
      text-align: center;
      padding: 18px;
      border-radius: 18px;
      background: #edf8f2;
      border: 1px solid #d7eddf;
    }

    .overall-score span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .overall-score strong {
      display: block;
      color: var(--nature);
      font-size: 40px;
      line-height: 1;
    }

    .overall-score small {
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       INFO
    ========================= */

    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .info-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .info-card span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .info-card strong {
      color: var(--text);
      font-size: 18px;
    }

    .important-number {
      color: var(--nature) !important;
    }

    /* =========================
       SECTION
    ========================= */

    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 23px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .section-title {
      margin-bottom: 20px;
    }

    .section-title small {
      color: var(--nature);
      font-size: 11px;
      font-weight: bold;
    }

    .section-title h2 {
      margin: 5px 0 0;
      font-size: 20px;
      color: var(--text);
    }

    /* =========================
       CRITERIA
    ========================= */

    .criteria-list {
      display: grid;
      gap: 15px;
    }

    .criterion {
      display: grid;
      grid-template-columns: 150px 1fr 55px;
      align-items: center;
      gap: 15px;
    }

    .criterion-name {
      font-weight: bold;
      color: var(--text);
    }

    .progress {
      height: 10px;
      background: #e9eeeb;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: 20px;
      background: var(--nature);
      transition: width .5s ease;
    }

    .criterion-score {
      text-align: left;
      color: var(--nature);
      font-weight: bold;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrapper {
      overflow-x: auto;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    .history-table th,
    .history-table td {
      padding: 14px 10px;
      text-align: right;
      border-bottom: 1px solid var(--border);
    }

    .history-table th {
      color: var(--muted);
      font-size: 13px;
      font-weight: normal;
    }

    .history-table td {
      color: var(--text);
      font-size: 14px;
    }

    .history-score {
      color: var(--nature);
      font-weight: bold;
    }

    /* =========================
       NOTICE
    ========================= */

    .notice {
      margin-top: 20px;
      background: #f5f8f6;
      border-right: 4px solid var(--nature);
      border-radius: 12px;
      padding: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .empty {
      text-align: center;
      padding: 30px 15px;
      color: var(--muted);
    }

    .loading {
      text-align: center;
      padding: 70px 15px;
      color: var(--muted);
      font-size: 15px;
    }

    .error-box {
      background: #fff;
      border: 1px solid #eadcdc;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      color: #8a3333;
    }

    /* =========================
       FOOTER
    ========================= */

    .athlete-footer {
      text-align: center;
      padding: 25px 15px;
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .profile-header {
        grid-template-columns: auto 1fr;
      }

      .overall-score {
        grid-column: 1 / -1;
      }

      .info-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 550px) {

      .athlete-header {
        padding: 12px;
      }

      .header-inner {
        gap: 8px;
      }

      .brand-text span {
        display: none;
      }

      .brand-logo {
        width: 42px;
        height: 42px;
      }

      .back-btn {
        padding: 9px 12px;
        font-size: 12px;
      }

      .athlete-page {
        padding: 20px 12px 45px;
      }

      .page-title h1 {
        font-size: 23px;
      }

      .profile-header {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 20px;
      }

      .athlete-avatar {
        margin: auto;
      }

      .info-grid {
        grid-template-columns: 1fr 1fr;
      }

      .info-card {
        padding: 15px;
      }

      .criterion {
        grid-template-columns: 1fr 45px;
        gap: 9px;
      }

      .criterion .progress {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .criterion-score {
        grid-column: 2;
        grid-row: 1;
      }

      .section-card {
        padding: 18px;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="athlete-header">

    <div class="header-inner">

      <div class="brand">

        <div class="brand-logo">
          🥋
        </div>

        <div class="brand-text">

          <strong>
            جودو طبیعت
          </strong>

          <span>
            سامانه عملکرد و پیشرفت ورزشکاران
          </span>

        </div>

      </div>


      <a
        href="coach.html"
        class="back-btn"
      >
        ← بازگشت
      </a>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="athlete-page">

    <div class="page-title">

      <small>
        ATHLETE PROFILE
      </small>

      <h1>
        پروفایل ورزشکار
      </h1>

      <p>
        اطلاعات، ارزیابی‌ها و روند پیشرفت ورزشکار
      </p>

    </div>


    <div id="pageContent">

      <div class="loading">
        در حال دریافت اطلاعات ورزشکار...
      </div>

    </div>

  </main>


  <footer class="athlete-footer">
    جودو طبیعت • سامانه باشگاه
  </footer>


  <!-- =========================
       SUPABASE
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://bkkdgywdptufjsaepehc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KBAMUqB0oL8fA0iNIKcv-w_brwIBHpd";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const pageContent =
      document.getElementById(
        "pageContent"
      );


    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function showError(message) {

      pageContent.innerHTML = `

        <div class="error-box">

          <div style="font-size:35px;">
            ⚠️
          </div>

          <h2>
            دریافت اطلاعات انجام نشد
          </h2>

          <p>
            ${escapeHTML(message)}
          </p>

        </div>

      `;

    }


    async function loadAthlete() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const athleteId =
        params.get("id");


      if (!athleteId) {

        showError(
          "شناسه ورزشکار در آدرس صفحه وجود ندارد."
        );

        return;

      }


      const {
        data: athlete,
        error
      } =
        await supabaseClient
          .from("athletes")
          .select(`
            id,
            first_name,
            last_name,
            national_id,
            age_group,
            weight,
            photo_url,
            total_score,
            bio
          `)
          .eq("id", athleteId)
          .single();


      if (error) {

        console.error(
          "Athlete error:",
          error
        );

        showError(
          "اطلاعات ورزشکار از پایگاه داده دریافت نشد."
        );

        return;

      }


      renderAthlete(
        athlete
      );

    }


    function renderAthlete(
      athlete
    ) {

      const fullName =
        [
          athlete.first_name,
          athlete.last_name
        ]
          .filter(Boolean)
          .join(" ") ||
        "بدون نام";


      const score =
        athlete.total_score !== null &&
        athlete.total_score !== undefined
          ? Number(
              athlete.total_score
            ).toFixed(1)
          : "—";


      const weight =
        athlete.weight !== null &&
        athlete.weight !== undefined
          ? `${athlete.weight} کیلوگرم`
          : "ثبت نشده";


      const ageGroup =
        athlete.age_group ||
        "ثبت نشده";


      const nationalId =
        athlete.national_id ||
        "ثبت نشده";


      const avatar =
        athlete.photo_url
          ? `
            <img
              src="${escapeHTML(athlete.photo_url)}"
              alt="${escapeHTML(fullName)}"
              style="
                width:100%;
                height:100%;
                object-fit:cover;
                border-radius:22px;
              "
            >
          `
          : "🥋";


      pageContent.innerHTML = `

        <!-- PROFILE -->

        <section class="profile-header">

          <div class="athlete-avatar">
            ${avatar}
          </div>


          <div class="profile-info">

            <h2>
              ${escapeHTML(fullName)}
            </h2>

            <p>
              رده سنی:
              <strong>
                ${escapeHTML(ageGroup)}
              </strong>
            </p>

            <p class="status">
              <span class="status-dot"></span>
              وضعیت: فعال
            </p>

          </div>


          <div class="overall-score">

            <span>
              امتیاز کلی
            </span>

            <strong>
              ${escapeHTML(score)}
            </strong>

            <small>
              از ۱۰
            </small>

          </div>

        </section>


        <!-- INFO -->

        <section class="info-grid">

          <div class="info-card">

            <span>
              وزن
            </span>

            <strong>
              ${escapeHTML(weight)}
            </strong>

          </div>


          <div class="info-card">

            <span>
              رده سنی
            </span>

            <strong>
              ${escapeHTML(ageGroup)}
            </strong>

          </div>


          <div class="info-card">

            <span>
              کد ملی
            </span>

            <strong>
              ${escapeHTML(nationalId)}
            </strong>

          </div>


          <div class="info-card">

            <span>
              امتیاز کلی
            </span>

            <strong class="important-number">
              ${escapeHTML(score)}
            </strong>

          </div>

        </section>


        <!-- EVALUATION -->

        <section class="section-card">

          <div class="section-title">

            <small>
              EVALUATION
            </small>

            <h2>
              معیارهای ارزیابی
            </h2>

          </div>


          <div
            id="criteriaList"
            class="criteria-list"
          >

            <div class="empty">
              هنوز ارزیابی‌ای برای این ورزشکار ثبت نشده است.
            </div>

          </div>


          <div class="notice">
            تمام معیارها به صورت برابر در امتیاز نهایی محاسبه می‌شوند و هیچ ضریبی در سیستم وجود ندارد.
          </div>

        </section>


        <!-- HISTORY -->

        <section class="section-card">

          <div class="section-title">

            <small>
              HISTORY
            </small>

            <h2>
              سابقه ارزیابی
            </h2>

          </div>


          <div class="table-wrapper">

            <table class="history-table">

              <thead>

                <tr>
                  <th>دوره</th>
                  <th>تاریخ</th>
                  <th>امتیاز</th>
                </tr>

              </thead>

              <tbody>

                <tr>
                  <td colspan="3">
                    <div class="empty">
                      هنوز سابقه ارزیابی ثبت نشده است.
                    </div>
                  </td>
                </tr>

              </tbody>

            </table>

          </div>

        </section>


        <!-- BIO -->

        <section class="section-card">

          <div class="section-title">

            <small>
              INFORMATION
            </small>

            <h2>
              درباره ورزشکار
            </h2>

          </div>


          <p
            style="
              color:#68716d;
              line-height:2;
              margin:0;
            "
          >
            ${
              athlete.bio
                ? escapeHTML(athlete.bio)
                : "توضیحی برای این ورزشکار ثبت نشده است."
            }
          </p>

        </section>

      `;

    }


    loadAthlete();

  </script>

</body>

</html>
